<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Journal Trade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: barra titolo con schede, colonna unica (max 1120px): KPI, grafici affiancati, elenco trade. Numeri in mono tabulare. */
:root{
  --bg:#eef0f3;--surface:#ffffff;--surface2:#f5f6f8;--ink:#12171d;--ink2:#3d4752;--ink3:#69747f;--line:#dde1e6;
  --accent:#0e6b73;--accent-ink:#ffffff;--gain:#0f7a54;--loss:#b4372c;--flat:#5f6b78;
  --gain-bg:#e1f2ea;--loss-bg:#f8e5e2;--flat-bg:#e8ebee;--warn:#8a5a00;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d1115;--surface:#151b21;--surface2:#1b2229;--ink:#e8ecf0;--ink2:#b8c1ca;--ink3:#8794a1;--line:#28323b;
  --accent:#54c2c9;--accent-ink:#07181a;--gain:#4cc79a;--loss:#ff8e82;--flat:#9aa7b4;
  --gain-bg:#12281f;--loss-bg:#301a18;--flat-bg:#222b33;--warn:#e0b050;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);padding:0 16px 48px}
.wrap{max-width:1120px;margin:0 auto}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 0 10px;display:flex;gap:12px 20px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
h1{font-size:19px;font-weight:600;margin:0;letter-spacing:-.01em}
.sub{color:var(--ink3);font-size:12px}
nav{display:flex;gap:4px;margin-left:auto;background:var(--surface2);padding:3px;border-radius:8px;border:1px solid var(--line)}
nav button{background:transparent;color:var(--ink2);border:0;padding:7px 14px;border-radius:6px;font:500 13px var(--sans);cursor:pointer}
nav button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
button{font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,tr.trade:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:7px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.del{background:transparent;color:var(--loss);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
section{display:grid;gap:16px;padding-top:18px}
section[hidden]{display:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel h2{font-size:12px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin:0 0 12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.kpi .l{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font:500 24px/1.2 var(--mono);margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--ink3);margin-top:2px}
.gain{color:var(--gain)}.loss{color:var(--loss)}.flat{color:var(--flat)}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
svg{display:block;width:100%;height:auto}
svg text{font:11px var(--mono);fill:var(--ink3)}
.chartbox{position:relative}
#tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:6px;font:12px var(--mono);white-space:nowrap;transform:translate(-50%,-120%);display:none;z-index:5}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-size:11px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:9px 10px;background:var(--surface2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.trade{cursor:pointer}
tr.trade:hover td{background:var(--surface2)}
td.r,th.r{text-align:right}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font:600 12px var(--sans);white-space:nowrap}
.pill.gain{background:var(--gain-bg)}.pill.loss{background:var(--loss-bg)}.pill.flat{background:var(--flat-bg)}
.dir{font:600 12px var(--mono)}
.detail td{background:var(--surface2);padding:14px 16px}
.detail dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 20px;margin:0}
.detail dt{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.detail dd{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{height:90px;border-radius:6px;border:1px solid var(--line);cursor:zoom-in}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--ink3);margin-bottom:3px}
input[type=text],input[type=date],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);font:inherit}
textarea{min-height:70px;resize:vertical}
.filters>div{min-width:130px}
.state{padding:28px 12px;text-align:center;color:var(--ink3)}
.state.err{color:var(--loss)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 16px}
.checks label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);margin:0;padding:4px 0}
#drop{border:2px dashed var(--line);border-radius:10px;padding:22px 14px;text-align:center;color:var(--ink3);cursor:pointer}
#drop:focus,#drop.over{border-color:var(--accent);color:var(--ink);outline:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.low{outline:2px solid var(--warn)}
.ok{color:var(--gain)}.warn{color:var(--warn)}.err{color:var(--loss)}
a{color:var(--accent)}
.risk{display:flex;gap:8px;align-items:end}
.risk input{width:90px}.risk select{width:64px}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
#lightbox img{max-width:94vw;max-height:94vh}
@media (prefers-reduced-motion:no-preference){.panel,.kpi{animation:fade .25s ease-out both}@keyframes fade{from{opacity:.4;transform:translateY(3px)}}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div><h1>Journal Trade</h1><div class="sub" id="meta">caricamento…</div></div>
  <nav role="tablist" aria-label="Sezioni">
    <button role="tab" id="t-dashboard" aria-selected="true" data-tab="dashboard">Dashboard</button>
    <button role="tab" id="t-trade" aria-selected="false" data-tab="trade">Trade</button>
    <button role="tab" id="t-nuovo" aria-selected="false" data-tab="nuovo">Nuovo trade</button>
  </nav>
</header>

<section id="s-dashboard">
  <div class="row" style="justify-content:space-between">
    <div class="risk">
      <div><label for="risk">Rischio per trade (1R)</label><input type="text" id="risk" inputmode="decimal" placeholder="es. 100"></div>
      <div><label for="cur">Valuta</label><select id="cur"><option value="€">€</option><option value="$">$</option></select></div>
    </div>
    <div class="row">
      <button class="btn sec" id="imp">Importa dal foglio (CSV)</button>
      <a class="btn sec" href="/api/export" style="text-decoration:none">Esporta CSV</a>
      <input type="file" id="impfile" accept=".csv,text/csv" hidden>
    </div>
  </div>
  <div id="impmsg" class="sub"></div>
  <div class="kpis" id="kpis"></div>
  <div class="two">
    <div class="panel"><h2>Curva dei risultati (R cumulati)</h2><div class="chartbox" id="eq"></div></div>
    <div class="panel"><h2>Risultato per mese (R)</h2><div class="chartbox" id="mo"></div></div>
  </div>
  <div class="panel"><h2>Per asset e per direzione</h2><div class="tablewrap"><table id="byasset"></table></div></div>
</section>

<section id="s-trade" hidden>
  <div class="panel">
    <h2>Trade registrati</h2>
    <div class="filters">
      <div><label for="f-asset">Asset</label><select id="f-asset"><option value="">Tutti</option></select></div>
      <div><label for="f-dir">Direzione</label><select id="f-dir"><option value="">Tutte</option><option>BUY</option><option>SELL</option></select></div>
      <div><label for="f-res">Esito</label><select id="f-res"><option value="">Tutti</option><option value="TP">Take Profit</option><option value="SL">Stop Loss</option><option value="BE">Break Even</option><option value="OPEN">Aperti</option></select></div>
      <div style="flex:1"><label for="f-q">Cerca nelle note e nel contesto</label><input type="text" id="f-q" placeholder="testo…"></div>
    </div>
    <div class="tablewrap"><table id="trades"></table></div>
    <div class="sub" id="count" style="margin-top:8px"></div>
  </div>
</section>

<section id="s-nuovo" hidden>
  <div class="panel">
    <h2 id="ftitle">Nuovo trade</h2>
    <div id="drop" tabindex="0">Clicca qui e incolla (Ctrl/⌘+V) uno screenshot, trascinalo o scegli un file. Puoi aggiungerne più di uno.</div>
    <input id="file" type="file" accept="image/*" multiple hidden>
    <div class="thumbs" id="thumbs" style="margin-top:10px"></div>
    <div class="row" style="margin-top:12px"><button class="btn sec" id="read" disabled>Leggi dati dallo screenshot</button><span class="sub" id="rstat"></span></div>
  </div>
  <div class="panel">
    <h2>Dati del trade</h2>
    <div class="grid">
      <div><label for="asset">Asset</label><input type="text" id="asset" placeholder="XAUUSD"></div>
      <div><label for="side">Direzione</label><select id="side"><option value="">—</option><option>BUY</option><option>SELL</option></select></div>
      <div><label for="date">Data</label><input type="date" id="date"></div>
      <div><label for="time">Orario (HH:MM, ora italiana)</label><input type="text" id="time" placeholder="10:30"></div>
      <div><label for="entry">Entry</label><input type="text" id="entry" inputmode="decimal"></div>
      <div><label for="sl">Stop Loss</label><input type="text" id="sl" inputmode="decimal"></div>
      <div><label for="tp">Take Profit</label><input type="text" id="tp" inputmode="decimal"></div>
      <div><label for="sl_pips">SL (pips)</label><input type="text" id="sl_pips" inputmode="decimal" placeholder="automatico"></div>
      <div><label for="rr_plan">R:R pianificato</label><input type="text" id="rr_plan" placeholder="1:3 o 3"></div>
      <div><label for="rr_final">R:R finale</label><input type="text" id="rr_final" placeholder="1:4 o 4"></div>
      <div><label for="result">Esito</label><select id="result"><option value="OPEN">Aperto</option><option value="TP">Take Profit</option><option value="SL">Stop Loss</option><option value="BE">Break Even</option></select></div>
      <div><label for="r">R realizzato</label><input type="text" id="r" inputmode="decimal" placeholder="automatico"></div>
      <div><label for="poi">POI</label><input type="text" id="poi" list="pl" placeholder="es. OB"><datalist id="pl"><option value="OB"><option value="FVG"><option value="Imbalance"></datalist></div>
      <div><label for="setup_ok">Setup rispettato</label><select id="setup_ok"><option value="">—</option><option>SI</option><option>NO</option></select></div>
      <div><label for="entry_ok">Entry rispettata</label><select id="entry_ok"><option value="">—</option><option>SI</option><option>NO</option></select></div>
      <div><label for="mgmt_ok">Managment rispettato</label><select id="mgmt_ok"><option value="">—</option><option>SI</option><option>NO</option></select></div>
      <div><label for="alert_id">ID avviso Telegram</label><input type="text" id="alert_id"></div>
    </div>
    <div style="margin-top:12px"><label for="context">Contesto (la tua lettura: macro, struttura HTF, perché entri)</label><textarea id="context"></textarea></div>
    <div style="margin-top:12px"><label for="notes">Note</label><textarea id="notes"></textarea></div>
    <div style="margin-top:12px"><label for="emotions">Emozioni / valutazione</label><input type="text" id="emotions"></div>
  </div>
  <div class="panel"><h2>Confluenze</h2><div class="checks" id="checks"></div></div>
  <div class="panel"><div class="row"><button class="btn" id="save">Salva trade</button><button class="btn sec" id="reset">Svuota</button></div><div id="msg" style="margin-top:12px"></div></div>
</section>
</div>
<div id="tip"></div>
<div id="lightbox"><img alt="Screenshot"></div>

<script>
const CHECKS = ["MACRO","FAVORE BIAS","REVERSAL ZONE","SWEEP LIQUIDITÀ","VWAP","SL STRUTTURALE","VOLUME TICK","DIVERGENZA MACD","CHOCH M1 + MITIGAZIONE OB","MOVE-to-BE","Deep Mitigation 1","Deep Mitigation 2"];
const $ = id => document.getElementById(id);
const it = (v, d = 1) => Number.isFinite(v) ? v.toLocaleString("it-IT", {minimumFractionDigits: d, maximumFractionDigits: 2}) : "—";
const sgn = (v, d = 1) => Number.isFinite(v) ? (v > 0 ? "+" : v < 0 ? "−" : "") + it(Math.abs(v), d) : "—";
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const dmy = d => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || ""); return m ? `${m[3]}/${m[2]}/${m[1]}` : (d || ""); };
const when = t => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(t.date || ""); if (!m) return null; const h = /^(\d{1,2}):(\d{2})/.exec(t.time || ""); return new Date(+m[1], +m[2] - 1, +m[3], h ? +h[1] : 0, h ? +h[2] : 0); };
let TR = [], CAN_EXTRACT = false, editingId = null, imgs = [], loaded = null;

async function api(path, opt) {
  const r = await fetch(path, opt); const txt = await r.text(); let j = null; try { j = JSON.parse(txt); } catch (e) {}
  if (!r.ok) throw new Error((j && j.error) || ("Errore " + r.status));
  return j;
}
async function load() {
  try {
    const j = await api("/api/trades"); TR = j.trades; CAN_EXTRACT = j.extract;
    TR.forEach(t => { t.when = when(t); });
    $("meta").textContent = `${TR.length} trade · dati su questo computer`;
    renderAll();
  } catch (e) { $("meta").textContent = "server non raggiungibile"; $("kpis").innerHTML = `<div class="state err">${esc(e.message)}. Controlla che il programma sia ancora in esecuzione nel Terminale.</div>`; }
}

/* ---------- statistiche ---------- */
const closed = () => TR.filter(t => t.result !== "OPEN" && Number.isFinite(t.r)).sort((a, b) => (a.when || 0) - (b.when || 0));
function stats(list) {
  const n = list.length, w = list.filter(t => t.r > 0.0001), l = list.filter(t => t.r < -0.0001);
  const tot = list.reduce((s, t) => s + t.r, 0), gw = w.reduce((s, t) => s + t.r, 0), gl = -l.reduce((s, t) => s + t.r, 0);
  let peak = 0, c = 0, dd = 0; list.forEach(t => { c += t.r; peak = Math.max(peak, c); dd = Math.max(dd, peak - c); });
  return {n, w: w.length, l: l.length, be: n - w.length - l.length, tot, exp: n ? tot / n : NaN, wr: n ? w.length / n : NaN, pf: gl > 0 ? gw / gl : NaN, dd,
    avgW: w.length ? gw / w.length : NaN, avgL: l.length ? -gl / l.length : NaN};
}
const money = r => { const k = parseFloat(($("risk").value || "").replace(",", ".")); return Number.isFinite(k) && k > 0 && Number.isFinite(r) ? `${$("cur").value} ${sgn(r * k, 0)}` : ""; };

/* ---------- rendering ---------- */
const kpi = (l, v, s, cls) => `<div class="kpi"><div class="l">${l}</div><div class="v ${cls || ""}">${v}</div><div class="s">${s || "&nbsp;"}</div></div>`;
function renderKPIs() {
  const c = closed(), s = stats(c), open = TR.filter(t => t.result === "OPEN").length;
  const disc = TR.map(t => t.discipline).filter(Number.isFinite), dm = disc.length ? Math.round(disc.reduce((a, b) => a + b, 0) / disc.length) : NaN;
  const cls = v => v > 0 ? "gain" : v < 0 ? "loss" : "";
  $("kpis").innerHTML =
    kpi("Risultato totale", sgn(s.tot) + " R", money(s.tot), cls(s.tot)) +
    kpi("Trade chiusi", s.n, `${s.w} TP · ${s.l} SL · ${s.be} BE${open ? " · " + open + " aperti" : ""}`) +
    kpi("Win rate", Number.isFinite(s.wr) ? it(s.wr * 100, 0) + "%" : "—", "sui trade chiusi") +
    kpi("Media per trade", sgn(s.exp, 2) + " R", "expectancy", cls(s.exp)) +
    kpi("Profit factor", Number.isFinite(s.pf) ? it(s.pf, 2) : "—", `media TP ${sgn(s.avgW)} R · SL ${sgn(s.avgL)} R`) +
    kpi("Max drawdown", s.dd ? "−" + it(s.dd) + " R" : "0 R", money(-s.dd), s.dd ? "loss" : "") +
    kpi("Disciplina media", Number.isFinite(dm) ? it(dm, 0) + "/100" : "—", "rispetto di setup, entry e gestione");
}
function axisScale(min, max, n) {
  const span = (max - min) || 1, raw = span / n, e = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / e;
  const st = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * e, lo = Math.floor(min / st) * st, hi = Math.ceil(max / st) * st, t = [];
  for (let v = lo; v <= hi + 1e-9; v += st) t.push(+v.toFixed(6));
  return {lo, hi, t};
}
const tipEl = $("tip");
function showTip(box, x, y, html) { if (tipEl.parentElement !== box) box.appendChild(tipEl); tipEl.style.display = "block"; tipEl.innerHTML = html; tipEl.style.left = x + "px"; tipEl.style.top = y + "px"; }
const hideTip = () => { tipEl.style.display = "none"; };
function renderEquity() {
  const c = closed(), box = $("eq");
  if (c.length < 1) { box.innerHTML = '<div class="state">Nessun trade chiuso con risultato in R.</div>'; return; }
  let cum = 0; const pts = [{i: 0, v: 0, t: null}].concat(c.map((t, i) => ({i: i + 1, v: (cum += t.r), t})));
  const W = 640, H = 270, L = 44, Rr = 16, T = 14, B = 26;
  const ys = axisScale(Math.min(...pts.map(p => p.v), 0), Math.max(...pts.map(p => p.v), 0), 4);
  const X = i => L + (pts.length > 1 ? i / (pts.length - 1) : 0) * (W - L - Rr), Y = v => T + (ys.hi - v) / (ys.hi - ys.lo) * (H - T - B);
  const line = pts.map((p, k) => (k ? "L" : "M") + X(p.i).toFixed(1) + " " + Y(p.v).toFixed(1)).join(" ");
  const area = line + ` L${X(pts.length - 1).toFixed(1)} ${Y(0).toFixed(1)} L${X(0).toFixed(1)} ${Y(0).toFixed(1)} Z`;
  const last = pts[pts.length - 1];
  let g = ys.t.map(v => `<line x1="${L}" x2="${W - Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="${v === 0 ? 1.4 : 1}" ${v === 0 ? "" : 'stroke-dasharray="2 4"'}/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${it(v, 0)}</text>`).join("");
  g += `<text x="${L}" y="${H - 6}">trade 1</text><text x="${W - Rr}" y="${H - 6}" text-anchor="end">trade ${c.length}</text>`;
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Curva dei risultati cumulati in R">${g}
    <path d="${area}" fill="var(--accent)" fill-opacity=".10"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${X(last.i)}" cy="${Y(last.v)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${X(last.i) - 8}" y="${Y(last.v) - 10}" text-anchor="end" style="fill:var(--ink);font-weight:500">${sgn(last.v)} R</text>
    <line id="cx" y1="${T}" y2="${H - B}" stroke="var(--ink3)" stroke-dasharray="3 3" visibility="hidden"/><circle id="cp" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>
    <rect x="${L}" y="0" width="${W - L - Rr}" height="${H}" fill="transparent" id="hit"/></svg>`;
  const svg = box.querySelector("svg"), hit = $("hit");
  hit.addEventListener("pointermove", ev => { const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) / r.width * W; let k = Math.round((px - L) / (W - L - Rr) * (pts.length - 1)); k = Math.max(0, Math.min(pts.length - 1, k));
    const p = pts[k]; $("cx").setAttribute("x1", X(p.i)); $("cx").setAttribute("x2", X(p.i)); $("cx").setAttribute("visibility", "visible"); $("cp").setAttribute("cx", X(p.i)); $("cp").setAttribute("cy", Y(p.v)); $("cp").setAttribute("visibility", "visible");
    showTip(box, X(p.i) / W * r.width, Y(p.v) / H * r.height, p.t ? `${esc(p.t.asset)} ${esc(p.t.side)} · ${dmy(p.t.date)}<br>${sgn(p.t.r)} R · totale ${sgn(p.v)} R` : "Partenza 0 R"); });
  hit.addEventListener("pointerleave", () => { hideTip(); $("cx").setAttribute("visibility", "hidden"); $("cp").setAttribute("visibility", "hidden"); });
}
const MESI = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
function renderMonthly() {
  const c = closed(), box = $("mo");
  if (!c.length) { box.innerHTML = '<div class="state">Nessun dato.</div>'; return; }
  const m = new Map(); c.forEach(t => { if (!t.when) return; const k = t.when.getFullYear() * 12 + t.when.getMonth(); m.set(k, (m.get(k) || 0) + t.r); });
  const data = [...m.keys()].sort((a, b) => a - b).map(k => ({k, v: m.get(k)}));
  const W = 420, H = 270, L = 36, T = 22, B = 28, ys = axisScale(Math.min(...data.map(d => d.v), 0), Math.max(...data.map(d => d.v), 0), 4);
  const Y = v => T + (ys.hi - v) / (ys.hi - ys.lo) * (H - T - B), step = (W - L - 10) / data.length, bw = Math.min(40, step * .62);
  let g = ys.t.map(v => `<line x1="${L}" x2="${W - 6}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="${v === 0 ? 1.4 : 1}" ${v === 0 ? "" : 'stroke-dasharray="2 4"'}/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${it(v, 0)}</text>`).join("");
  data.forEach((d, i) => { const cx = L + step * (i + .5), y0 = Y(0), y1 = Y(d.v), top = Math.min(y0, y1), h = Math.max(Math.abs(y1 - y0), 1.5), col = d.v >= 0 ? "var(--gain)" : "var(--loss)";
    g += `<rect x="${cx - bw / 2}" y="${top}" width="${bw}" height="${h}" rx="3" fill="${col}"><title>${MESI[d.k % 12]} ${Math.floor(d.k / 12)}: ${sgn(d.v)} R</title></rect>`;
    g += `<text x="${cx}" y="${d.v >= 0 ? top - 5 : top + h + 13}" text-anchor="middle" style="fill:var(--ink)">${sgn(d.v)}</text><text x="${cx}" y="${H - 8}" text-anchor="middle">${MESI[d.k % 12]} ${String(Math.floor(d.k / 12)).slice(2)}</text>`; });
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Risultato mensile in R">${g}</svg>`;
}
function renderAssets() {
  const c = closed(), keys = [...new Set(c.map(t => t.asset))].sort();
  const rows = keys.map(a => ["asset", a, stats(c.filter(t => t.asset === a))]).concat(["BUY", "SELL"].map(d => ["dir", d, stats(c.filter(t => t.side === d))]));
  const cell = s => `<td class="r num">${s.n}</td><td class="r num">${Number.isFinite(s.wr) ? it(s.wr * 100, 0) + "%" : "—"}</td><td class="r num ${s.tot > 0 ? "gain" : s.tot < 0 ? "loss" : ""}">${sgn(s.tot)} R${money(s.tot) ? `<div class="sub">${money(s.tot)}</div>` : ""}</td><td class="r num">${sgn(s.exp, 2)}</td><td class="r num">${Number.isFinite(s.pf) ? it(s.pf, 2) : "—"}</td>`;
  $("byasset").innerHTML = `<thead><tr><th>Gruppo</th><th class="r">Trade</th><th class="r">Win rate</th><th class="r">Totale</th><th class="r">Media R</th><th class="r">Profit factor</th></tr></thead><tbody>` +
    (rows.length ? rows.map(([k, n, s]) => `<tr><td><b>${esc(n)}</b> <span class="sub">${k === "dir" ? "direzione" : "asset"}</span></td>${cell(s)}</tr>`).join("") : `<tr><td colspan="6"><div class="state">Nessun trade chiuso.</div></td></tr>`) + `</tbody>`;
}
const pill = t => t.result === "TP" ? '<span class="pill gain">▲ Take Profit</span>' : t.result === "SL" ? '<span class="pill loss">▼ Stop Loss</span>' : t.result === "BE" ? '<span class="pill flat">■ Break Even</span>' : '<span class="pill flat">● Aperto</span>';
function filtered() {
  const a = $("f-asset").value, d = $("f-dir").value, r = $("f-res").value, q = $("f-q").value.trim().toLowerCase();
  return TR.filter(t => (!a || t.asset === a) && (!d || t.side === d) && (!r || t.result === r) && (!q || ((t.notes || "") + " " + (t.context || "")).toLowerCase().includes(q)));
}
function renderTable() {
  const list = filtered(), sel = $("f-asset"), cur = sel.value, assets = [...new Set(TR.map(t => t.asset))].sort();
  if (sel.options.length - 1 !== assets.length) { sel.innerHTML = '<option value="">Tutti</option>' + assets.map(a => `<option>${esc(a)}</option>`).join(""); sel.value = cur; }
  $("trades").innerHTML = `<thead><tr><th>Data</th><th>Asset</th><th>Dir.</th><th class="r">SL pips</th><th>R:R</th><th>Esito</th><th class="r">Risultato</th><th class="r">Disciplina</th><th></th></tr></thead><tbody>` +
    (list.length ? list.map(t => `<tr class="trade" tabindex="0" data-id="${t.id}" aria-expanded="false"><td class="num">${dmy(t.date)}<div class="sub">${esc(t.time)}</div></td><td><b>${esc(t.asset)}</b></td><td class="dir">${t.side === "BUY" ? "▲ BUY" : t.side === "SELL" ? "▼ SELL" : "—"}</td><td class="r num">${Number.isFinite(t.sl_pips) ? it(t.sl_pips, 1) : "—"}</td><td class="num">${esc(t.rr_plan) || "—"}</td><td>${pill(t)}</td>` +
      `<td class="r num ${t.r > 0 ? "gain" : t.r < 0 ? "loss" : ""}">${Number.isFinite(t.r) && t.result !== "OPEN" ? sgn(t.r) + " R" : "—"}${money(t.r) && t.result !== "OPEN" ? `<div class="sub">${money(t.r)}</div>` : ""}</td><td class="r num">${Number.isFinite(t.discipline) ? it(t.discipline, 0) : "—"}</td><td class="sub">▾</td></tr>`).join("")
      : `<tr><td colspan="9"><div class="state">Nessun trade${TR.length ? " con questi filtri" : " ancora: aggiungine uno da “Nuovo trade” oppure importa il foglio dalla Dashboard"}.</div></td></tr>`) + `</tbody>`;
  $("count").textContent = `${list.length} di ${TR.length} trade`;
}
function detailHtml(t) {
  const d = (l, v) => v ? `<div><dt>${l}</dt><dd>${v}</dd></div>` : "";
  const imgsH = (t.images || []).map(n => `<img src="/img/${encodeURIComponent(n)}" alt="Screenshot" data-big="1">`).join("");
  return `<dl>${d("Contesto", esc(t.context))}${d("Note", esc(t.notes))}${d("Confluenze", (t.conf || []).length ? `<div class="chips">${t.conf.map(c => `<span class="chip">${esc(c)}</span>`).join("")}</div>` : "")}${d("POI", esc(t.poi))}` +
    `${d("Livelli", [t.entry != null ? "Entry " + t.entry : "", t.sl != null ? "SL " + t.sl : "", t.tp != null ? "TP " + t.tp : ""].filter(Boolean).join(" · "))}` +
    `${d("Setup / Entry / Managment", [t.setup_ok, t.entry_ok, t.mgmt_ok].map(x => esc(x) || "—").join(" · "))}${d("Valutazione", esc(t.emotions))}${d("R:R finale", esc(t.rr_final))}${d("ID avviso", esc(t.alert_id))}` +
    `${d("Screenshot", imgsH ? `<div class="thumbs">${imgsH}</div>` : "")}${d("Link", (t.links || []).map((u, i) => `<a href="${esc(u)}" target="_blank" rel="noopener">immagine ${i + 1}</a>`).join(" · "))}` +
    `<div class="row"><button class="btn sec" data-edit="${t.id}">Modifica</button><button class="btn del" data-del="${t.id}">Elimina</button></div></dl>`;
}
function toggleRow(tr) {
  const nx = tr.nextElementSibling;
  if (nx && nx.classList.contains("detail")) { nx.remove(); tr.setAttribute("aria-expanded", "false"); return; }
  const t = TR.find(x => x.id === +tr.dataset.id), d = document.createElement("tr"); d.className = "detail"; d.innerHTML = `<td colspan="9">${detailHtml(t)}</td>`; tr.after(d); tr.setAttribute("aria-expanded", "true");
}
$("trades").addEventListener("click", async e => {
  const ed = e.target.closest("[data-edit]"), de = e.target.closest("[data-del]"), im = e.target.closest("img[data-big]");
  if (im) { $("lightbox").querySelector("img").src = im.src; $("lightbox").style.display = "flex"; return; }
  if (ed) { fillForm(TR.find(t => t.id === +ed.dataset.edit)); showTab("nuovo"); return; }
  if (de) {
    if (de.dataset.armed !== "1") { de.dataset.armed = "1"; de.textContent = "Conferma eliminazione"; return; }
    try { await api("/api/trades/" + de.dataset.del, {method: "DELETE"}); await load(); } catch (err) { de.textContent = err.message; } return;
  }
  const tr = e.target.closest("tr.trade"); if (tr) toggleRow(tr);
});
$("trades").addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr.trade")) { e.preventDefault(); toggleRow(e.target); } });
$("lightbox").addEventListener("click", () => { $("lightbox").style.display = "none"; });
["f-asset", "f-dir", "f-res"].forEach(id => $(id).addEventListener("change", renderTable)); $("f-q").addEventListener("input", renderTable);
function renderAll() { renderKPIs(); renderEquity(); renderMonthly(); renderAssets(); renderTable(); }
$("risk").value = store.get("jr_risk") || ""; $("cur").value = store.get("jr_cur") || "€";
["risk", "cur"].forEach(id => $(id).addEventListener("input", () => { store.set("jr_risk", $("risk").value); store.set("jr_cur", $("cur").value); if (TR.length) renderAll(); }));

/* ---------- import ---------- */
$("imp").addEventListener("click", () => $("impfile").click());
$("impfile").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return; $("impmsg").className = "sub"; $("impmsg").textContent = "Importazione…";
  try { const j = await api("/api/import", {method: "POST", body: await f.text()}); $("impmsg").className = "sub ok"; $("impmsg").textContent = `Importati ${j.added} trade, ${j.skipped} già presenti${j.bad ? ", " + j.bad + " righe senza data scartate" : ""}.`; await load(); }
  catch (err) { $("impmsg").className = "sub err"; $("impmsg").textContent = err.message; }
  e.target.value = "";
});

/* ---------- schede ---------- */
function showTab(name) {
  ["dashboard", "trade", "nuovo"].forEach(n => { $("s-" + n).hidden = n !== name; $("t-" + n).setAttribute("aria-selected", String(n === name)); });
  hideTip(); history.replaceState(null, "", "#" + name);
}
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));
const h0 = (location.hash || "").slice(1); if (["trade", "nuovo"].includes(h0)) showTab(h0);

/* ---------- form ---------- */
CHECKS.forEach(n => { const l = document.createElement("label"); l.innerHTML = `<input type="checkbox" data-name=""> <span></span>`; l.querySelector("input").dataset.name = n; l.querySelector("span").textContent = n; $("checks").appendChild(l); });
const F = ["asset", "side", "date", "time", "entry", "sl", "tp", "sl_pips", "rr_plan", "rr_final", "result", "r", "poi", "setup_ok", "entry_ok", "mgmt_ok", "alert_id", "context", "notes", "emotions"];
function msg(t, cls) { const m = $("msg"); m.className = cls || ""; m.textContent = t; }
function fillForm(t) {
  editingId = t ? t.id : null; loaded = t ? {r: t.r != null ? String(t.r) : "", result: t.result, ok: [t.setup_ok, t.entry_ok, t.mgmt_ok].join("|"), disc: t.discipline} : null; $("ftitle").textContent = t ? `Modifica trade #${t.id}` : "Nuovo trade";
  F.forEach(k => { $(k).value = t && t[k] != null ? t[k] : (k === "result" ? "OPEN" : ""); $(k).classList.remove("low"); });
  document.querySelectorAll("#checks input").forEach(i => i.checked = !!(t && (t.conf || []).includes(i.dataset.name)));
  imgs = t ? [...(t.images || [])] : []; drawThumbs(); $("save").textContent = t ? "Salva modifiche" : "Salva trade"; msg("");
}
function drawThumbs() { $("thumbs").innerHTML = imgs.map((n, i) => `<div><img src="${n.startsWith("data:") ? n : "/img/" + encodeURIComponent(n)}" alt="Screenshot ${i + 1}"><div><a href="#" data-rm="${i}">rimuovi</a></div></div>`).join(""); $("read").disabled = !imgs.length || !CAN_EXTRACT;
  $("rstat").textContent = !CAN_EXTRACT ? "La lettura automatica richiede ANTHROPIC_API_KEY in config.env; puoi compilare i campi a mano." : ""; }
$("thumbs").addEventListener("click", e => { const a = e.target.closest("[data-rm]"); if (a) { e.preventDefault(); imgs.splice(+a.dataset.rm, 1); drawThumbs(); } });
function addFile(f) { if (!f || !f.type.startsWith("image/")) return; const r = new FileReader(); r.onload = () => { imgs.push(r.result); drawThumbs(); }; r.readAsDataURL(f); }
$("drop").addEventListener("click", () => $("file").click());
$("drop").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("file").click(); } });
$("file").addEventListener("change", e => { [...e.target.files].forEach(addFile); e.target.value = ""; });
document.addEventListener("paste", e => { if ($("s-nuovo").hidden) return; for (const x of e.clipboardData.items) if (x.type.startsWith("image/")) { addFile(x.getAsFile()); e.preventDefault(); } });
["dragover", "dragenter"].forEach(ev => $("drop").addEventListener(ev, e => { e.preventDefault(); $("drop").classList.add("over"); }));
["dragleave", "drop"].forEach(ev => $("drop").addEventListener(ev, e => { e.preventDefault(); $("drop").classList.remove("over"); }));
$("drop").addEventListener("drop", e => [...e.dataTransfer.files].forEach(addFile));
$("read").addEventListener("click", async () => {
  const first = imgs.find(n => n.startsWith("data:")); if (!first) { $("rstat").textContent = "Aggiungi o ricarica lo screenshot per leggerlo."; return; }
  $("read").disabled = true; $("rstat").textContent = "Lettura in corso…";
  try {
    const o = await api("/api/extract", {method: "POST", body: JSON.stringify({data: first})});
    const map = {asset: o.asset, side: o.side, time: o.time, entry: o.entry, sl: o.sl, tp: o.tp, notes: o.notes}; if (o.result) map.result = /take/i.test(o.result) ? "TP" : /stop/i.test(o.result) ? "SL" : /break/i.test(o.result) ? "BE" : "OPEN";
    const dm = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(o.date || ""); if (dm) map.date = `${dm[3]}-${dm[2].padStart(2, "0")}-${dm[1].padStart(2, "0")}`;
    Object.entries(map).forEach(([k, v]) => { if (v != null && v !== "") { $(k).value = v; $(k).classList.remove("low"); } else if (k !== "result") $(k).classList.add("low"); });
    $("rstat").textContent = "Letto. I campi in giallo mancano: controlla tutto prima di salvare.";
  } catch (e) { $("rstat").textContent = e.message; }
  $("read").disabled = false;
});
$("save").addEventListener("click", async () => {
  if (!$("asset").value.trim() || !$("side").value || !$("date").value) { msg("Servono almeno asset, direzione e data.", "warn"); return; }
  $("save").disabled = true; msg("Salvataggio…");
  try {
    const names = []; for (const n of imgs) names.push(n.startsWith("data:") ? (await api("/api/image", {method: "POST", body: JSON.stringify({data: n})})).name : n);
    const body = {}; F.forEach(k => body[k] = $(k).value); body.conf = [...document.querySelectorAll("#checks input:checked")].map(i => i.dataset.name); body.images = names;
    const old = editingId ? TR.find(t => t.id === editingId) : null; body.links = old ? old.links : [];
    const okNow = [body.setup_ok, body.entry_ok, body.mgmt_ok].join("|");
    body.discipline = loaded && loaded.ok === okNow ? loaded.disc : null;                  // disciplina: la ricalcola il server solo se cambiano i tre SI/NO
    const rTxt = $("r").value.trim();                                                       // R: vuoto o invariato con esito cambiato = ricalcolato; altrimenti resta quello scritto
    body.r = !rTxt || (loaded && rTxt === loaded.r && body.result !== loaded.result) ? null : rTxt;
    const res = await api(editingId ? "/api/trades/" + editingId : "/api/trades", {method: editingId ? "PUT" : "POST", body: JSON.stringify(body)});
    await load(); msg(`Trade salvato (#${res.id}).`, "ok"); fillForm(null); showTab("trade");
  } catch (e) { msg(e.message, "err"); }
  $("save").disabled = false;
});
$("reset").addEventListener("click", () => fillForm(null));

fillForm(null); load();
</script>
